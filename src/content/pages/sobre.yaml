      body: |-
        Passamos por todas as fases da internet: do ASP e PHP aos frameworks modernos, do WordPress às aplicações em Java e Angular. Essa bagagem nos ensinou o que realmente funciona e o que é só moda.

        Hoje unimos essa experiência às tecnologias mais rápidas e seguras do mercado para entregar sites que **carregam em um piscar de olhos**, **aparecem no Google** e são **fáceis de manter**.
